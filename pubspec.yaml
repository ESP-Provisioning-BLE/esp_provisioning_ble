name: esp_provisioning_ble
description: A Flutter plugin for Wi-Fi provisioning of ESP32 modules over Bluetooth Low Energy (BLE).
version: 1.1.0
homepage: https://espprovble.dev
repository: https://github.com/ESP-Provisioning-BLE/esp_provisioning_ble
issue_tracker: https://github.com/ESP-Provisioning-BLE/esp_provisioning_ble/issues
topics:
  - esp32
  - ble
  - bluetooth
  - provisioning
  - iot

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  protobuf: ^3.0.0
  cryptography: ^2.5.0
  collection: ^1.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mocktail: ^0.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ogabrielinacio.esp_provisioning_ble
        pluginClass: EspProvisioningBlePlugin
      ios:
        pluginClass: EspProvisioningBlePlugin
