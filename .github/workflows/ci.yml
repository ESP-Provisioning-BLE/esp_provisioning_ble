name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lowest Flutter release the package supports, built by the "minimum" entry
  # of the matrices below. This is the only place in CI to change it; keep it
  # equal to the flutter constraint in the environment of pubspec.yaml.
  FLUTTER_MIN_VERSION: "3.13.0"

jobs:
  package:
    # "package" and "example" are required status checks on main, so the
    # stable entries keep exactly those names. The other entries get a suffix.
    name: ${{ matrix.flutter == 'stable' && 'package' || format('package ({0})', matrix.flutter) }}
    runs-on: ubuntu-latest
    # The beta entry is an early warning and must not block merges.
    continue-on-error: ${{ matrix.flutter == 'beta' }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        flutter: [minimum, stable, beta]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ matrix.flutter == 'beta' && 'beta' || 'stable' }}
          flutter-version: ${{ matrix.flutter == 'minimum' && env.FLUTTER_MIN_VERSION || '' }}

      # This entry tests the package alone, on the oldest Flutter it supports.
      # The example targets current Flutter releases (its Dart constraint and
      # its Android project need them) and is tested on stable and beta;
      # compatibility of apps with older Flutter releases is covered by the
      # android-app job, which creates a fresh app with each version. On a
      # clean checkout, Flutter 3.13 also fails pub get --no-example (it reads
      # example/.dart_tool afterwards), so the example is removed here.
      - name: Remove the example
        if: matrix.flutter == 'minimum'
        run: rm -rf example

      - name: Install dependencies
        run: flutter pub get

      # The formatter output depends on the Dart version: check it on stable only.
      - name: Verify formatting
        if: matrix.flutter == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install lcov and drop generated files from coverage
        if: matrix.flutter == 'stable'
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info '*/generated/*' -o coverage/lcov.info --ignore-errors unused

      - name: Report coverage and enforce threshold (>= 60%)
        if: matrix.flutter == 'stable'
        uses: zgosalvez/github-actions-report-lcov@0e97540271bfaece1ddff20e7fa8d9a6ab1abf67 # v7.1.0
        with:
          coverage-files: coverage/lcov.info
          minimum-coverage: 60
          github-token: ${{ github.token }}
          # Only comment on same-repo PRs. Fork PRs get a read-only token, so
          # commenting fails with "Resource not accessible by integration".
          # Coverage is still computed and the 60% threshold is still enforced
          # on forks; they just don't get the inline comment.
          update-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Validate publishability
        if: matrix.flutter == 'stable'
        run: dart pub publish --dry-run

      # On the minimum Flutter, also check the lower bounds of the dependency
      # constraints.
      - name: Downgrade dependencies to their lowest allowed versions
        if: matrix.flutter == 'minimum'
        run: flutter pub downgrade

      - name: Analyze with downgraded dependencies
        if: matrix.flutter == 'minimum'
        run: flutter analyze

      - name: Run tests with downgraded dependencies
        if: matrix.flutter == 'minimum'
        run: flutter test

  example:
    # Required status check on main: the stable entry keeps the plain name.
    # The example requires Dart ^3.10.1, so there is no minimum entry.
    name: ${{ matrix.flutter == 'stable' && 'example' || format('example ({0})', matrix.flutter) }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.flutter == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter: [stable, beta]
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ matrix.flutter }}

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        if: matrix.flutter == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  android-app:
    # Builds a fresh app that depends on the plugin, which is how users consume
    # it, on the minimum supported Flutter, stable and beta. The example cannot
    # cover this: its Android project follows a single Flutter template.
    # Debug and release are both built because some failures only show up in
    # release builds (resource verification against the plugin's compileSdk).
    name: android-app (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.flutter == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter: [minimum, stable, beta]
    steps:
      - uses: actions/checkout@v4

      # The app template of older Flutter releases uses Gradle 7, which does
      # not run on JDK 21. JDK 17 runs every template from the minimum to beta.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ matrix.flutter == 'beta' && 'beta' || 'stable' }}
          flutter-version: ${{ matrix.flutter == 'minimum' && env.FLUTTER_MIN_VERSION || '' }}

      - name: Create an app that depends on the plugin
        run: |
          flutter create --platforms=android --project-name plugin_app --org dev.espprovble.ci "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          awk -v path="$GITHUB_WORKSPACE" '{ print } /^dependencies:/ { print "  esp_provisioning_ble:"; print "    path: " path }' pubspec.yaml > pubspec.yaml.new
          mv pubspec.yaml.new pubspec.yaml
          # Use the plugin from Dart too, so that its code is compiled in.
          cat > lib/main.dart <<'DART'
          import 'package:esp_provisioning_ble/esp_provisioning_ble.dart';
          import 'package:flutter/widgets.dart';

          void main() => runApp(Text('$EspProv', textDirection: TextDirection.ltr));
          DART
          rm -f test/widget_test.dart
          flutter pub get

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/app
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: ${{ runner.temp }}/app
        run: flutter build apk --release
